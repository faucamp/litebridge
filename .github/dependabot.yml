version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    exclude-paths:
      - "example" # Ignore example projects
      - "litebridge-spring-boot3-starter" # Spring Boot 3 compatibility
      - "litebridge-spring6" # Spring Framework 6 compatibility
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "org.litebridgedb.example:*" # Ignore example projects
      - dependency-name: "org.litebridgedb.spring:litebridge-spring-boot3-test" # Ignore SB3 compatibility test
